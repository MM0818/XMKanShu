import java.util.Date

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: 'org.greenrobot.greendao'

//用于生成时间
def buildTime() {
    def date = new Date()
    //yy年 MM月 dd日 HH小时 mm分钟 ss秒
    def formattedDate = date.format('yyyyMMdd_HHmm')
    return formattedDate
}
android {
    namespace "com.xmkanshu"
    compileSdkVersion 34
    buildToolsVersion '34.0.0'
    defaultConfig {
        applicationId "com.tdkankan"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 7
        versionName "1.0.5.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    // Kotlin编译配置
    kotlinOptions {
        jvmTarget = '17'
    }

    // Java编译配置
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def outputFile = output.outputFile
            if (outputFile != null && outputFile.name.endsWith('.apk')) {
                if (buildType.name.toLowerCase().contains("release")) {
                    def fileName = "../../../apk/TDkankan_${defaultConfig.versionName}_DATE-${buildTime()}.apk"
                    outputFileName = fileName
                } else {
                    def fileName = "TDkankan_${defaultConfig.versionName}-debug.apk"
                    outputFileName = fileName
                }
            }
        }
    }

//    // GreenDAO 配置
//    greendao {
//        schemaVersion 1 //当前数据库版本
//        daoPackage 'com.tdkankan.greendao.green'
//        targetGenDir 'src/main/java'
//    }
}



dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.0.0'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.3.0'
    implementation 'org.jsoup:jsoup:1.13.1'
    implementation 'com.github.HanHuoBin:BaseDialog:1.2.0'
    implementation 'com.android.volley:volley:1.1.1'
    //implementation 'org.greenrobot:greendao:3.3.0' // add library，GreenDAO 版本是 3.3.0，该版本发布于 2019 年，仅兼容 Gradle 6.x 及以下版本。
    //implementation 'org.greenrobot:greendao:3.5.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.core:core-ktx:1.10.0'
    // 保留 GreenDAO 核心库和注解处理器（关键）
    implementation 'org.greenrobot:greendao:3.3.0'
    //annotationProcessor 'org.greenrobot:greendao-annotation-processor:3.3.0'
    //上面那个是旧版本的名字，有错：不是 greendao-annotation-processor，而是 greendao-annotation！
    annotationProcessor 'org.greenrobot:greendao:3.3.0'

    // 添加Glide依赖
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Kotlin
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.0'

    // ViewModel + LiveData
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.6.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'

    // Kotlin协程
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
